# Complementa o catálogo: personagens vêm de data/characters (tabelas do jogo) e armas e sets do genshin-db.
# aliases: nome usado nas fontes → nome canônico em inglês do catálogo
# characters/weapons/artifactSets: entradas que a fonte ainda não tem (ou correções)
# O build avisa quando um override fica redundante porque a fonte passou a cobrir o caso.
aliases:
  # A Viajante é uma entrada só, a do Aether: o site não diferencia Lumine e Aether
  characters: { Lumine: Traveler, Aether: Traveler }
  weapons: {}
  artifactSets: {}
characters: []
weapons: []
artifactSets: []
